<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Recognition App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📄 Image Recognition</h1>
            <p class="subtitle">Upload a PDF or image to recognize text</p>
            
            <div class="upload-area" id="uploadArea">
                <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <p>Drag and drop your file here</p>
                <p class="small">or click to select</p>
                <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg" hidden>
            </div>

            <div id="loadingSpinner" class="hidden">
                <div class="spinner"></div>
                <p>Processing file...</p>
            </div>

            <div id="errorMessage" class="error hidden"></div>

            <div id="resultContainer" class="hidden">
                <div class="result-item">
                    <label>File Name:</label>
                    <p id="fileName"></p>
                </div>
                <div class="result-item">
                    <label>File Type:</label>
                    <p id="fileType"></p>
                </div>
                <div class="result-item">
                    <label>Recognized Text:</label>
                    <div id="recognizedText" class="text-output"></div>
                </div>
                <button onclick="resetForm()" class="btn-reset">Upload Another File</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
